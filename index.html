document.querySelector('.tabs').onclick=e=>{const k=e.target.dataset.k;if(!k)return;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.k==k));$$('m').hidden=k!='m';$$('p').hidden=k!='p';if(k=='p')pr()};
const opt=(a,lab)=>`<option value="">${lab}</option>`+[...new Set(a)].filter(Boolean).sort().map(x=>`<option>${esc(x)}</option>`).join('');
$$('fl').innerHTML=opt(PR.map(r=>r.l),'Todas');$$('fm').innerHTML=opt(PR.map(r=>r.m),'Todas');
function fillG(){const m=$$('fm').value,cur=$$('fg').value;$$('fg').innerHTML=opt(PR.filter(r=>!m||r.m==m).map(r=>r.s),'Todos');$$('fg').value=cur}
fillG();let sk='q',sd=-1,lim=200,last=[];
['q','fl','fm','fg','fp','fv'].forEach(i=>$$(i).addEventListener(i=='q'?'input':'change',()=>{if(i=='fm')fillG();lim=200;pr()}));
const EX=new Set(),EXG=new Set();
function pr(){const q=$$('q').value,QP=parseQ(q);$$('qi').innerHTML=QP.length?'<b>Entendi:</b> '+QP.map(pt=>pt.ing?`<span class="chip2">${esc(pt.word)}${pt.fz?' → '+pt.ing.k:''}: ${pt.ing.lab}</span>`:`<span class="chip2">“${esc(pt.word)}” no nome, grupo ou código (aceita erro de digitação)</span>`).join(' + '):'Dica: digite um ingrediente ou tipo de item (salsicha, frango, bacon, queijo, carne, batata, refri, cerveja, pizza, açaí, doce…). Também aceita erro de digitação e vários termos juntos, como "frango bacon".';const l=$$('fl').value,m=$$('fm').value,g=$$('fg').value,p=$$('fp').value,v=$$('fv').value;
 const F0=PR.filter(r=>(!l||r.l==l)&&(!m||r.m==m)&&(!g||r.s==g)&&(!p||(p=='any'?r.p:p=='none'?!r.p:r.p==p))&&QP.every(pt=>matchPart(r,pt)));
 // chips de categoria

 $$('cats').innerHTML=cg.size>1||EXG.size?'<span class="g" style="margin-right:6px">Categorias (toque para tirar ou incluir):</span>'+[...cg.entries()].sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<button class="cat${EXG.has(k)?' off':''}" data-g="${esc(k)}">${EXG.has(k)?'☐':'☑'} ${esc(k)} <span class="g">${nf(n)}</span></button>`).join(''):'';

 const M=new Map();F.forEach(r=>{const k=key(r);let a=M.get(k);if(!a){a={k:v+':'+k,r,q:0,v:0,ls:new Set(),np:new Set(),gx:true};M.set(k,a)}if(inc(r)){a.q+=r.q;a.v+=r.v;a.ls.add(r.l);a.np.add(r.s+r.c+r.n);a.gx=false}});
 let G=[...M.values()];const SM=QP.some(pt=>pt.ing&&pt.ing.k=='salsicha')&&(v=='p'||v=='pl');
 G.forEach(a=>{a.on=!a.gx&&!EX.has(a.k);a.sf=sfac(a.r);a.sq=a.q*a.sf.f});

 const nP=new Set(ON.flatMap(a=>[...a.np])).size,nL=new Set(ON.flatMap(a=>[...a.ls])).size,nOff=G.filter(a=>!a.gx&&!a.on).length;
 $$('pk').innerHTML=`<div class="kpi"><div class="l">Quantidade</div><div class="v">${nf(tq)}</div><div class="d">só itens marcados</div></div><div class="kpi"><div class="l">Valor</div><div class="v">R$ ${nf(tv,2)}</div><div class="d">${tq?nf(tv/tq,2)+' preço médio':''}</div></div>${SM?`<div class="kpi" style="border-color:#5b2c6f"><div class="l">🌭 Salsichas (estimado)</div><div class="v">${nf(tS)}</div><div class="d">duplo = 2 por unidade</div></div>`:''}<div class="kpi"><div class="l">Produtos</div><div class="v">${nf(nP)}</div><div class="d">${nf(nL)} lojas${nOff?` · ${nOff} desmarcado(s)`:''}${EXG.size?` · ${EXG.size} categoria(s) fora`:''}</div></div>`;
 const ar=k=>sk==k?(sd<0?' ↓':' ↑'):'';const c1={p:'Produto',pl:'Produto',g:'Grupo',l:'Loja'}[v];
 let t=`<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap"><button class="btn" id="ckA">☑ Marcar todos</button><button class="btn" id="ckN">☐ Desmarcar todos</button>${EX.size||EXG.size?'<button class="btn" id="ckR">Limpar escolhas</button>':''}</div><table><thead><tr><th style="width:28px"></th><th class="t s" data-s="n">${c1}${ar('n')}</th>${v=='pl'?'<th class="t">Loja</th>':''}${v=='p'||v=='pl'?'<th class="t">Grupo</th><th class="t">Pão</th>':''}${v=='g'?'<th class="t">Marca</th>':''}${v=='p'?'<th>Lojas</th>':''}${v=='g'||v=='l'?'<th>Produtos</th>':''}<th class="s" data-s="q">Quantidade${ar('q')}</th>${SM?'<th>Salsichas/unid.</th><th>Total salsichas</th>':''}<th class="s" data-s="v">Valor (R$)${ar('v')}</th><th class="s" data-s="pm">Preço médio${ar('pm')}</th><th>% qtd</th><th>% valor</th></tr></thead><tbody>`;
 t+=G.filter(a=>!a.gx).slice(0,lim).map(a=>{const r=a.r;const c=v=='g'?esc(r.s):v=='l'?esc(r.l):`${esc(r.n)}<div class="g">Cód. ${esc(r.c)}</div>`;
  return`<tr class="${a.on?'':'off'}"><td><input type="checkbox" class="ck" data-k="${esc(a.k)}" ${a.on?'checked':''}></td><td class="t">${c}</td>${v=='pl'?`<td class="t g">${esc(r.l)}</td>`:''}${v=='p'||v=='pl'?`<td class="t g">${esc(r.s)}</td><td class="t g">${PL[r.p]}</td>`:''}${v=='g'?`<td class="t g">${esc(r.m)}</td>`:''}${v=='p'?`<td>${a.ls.size}</td>`:''}${v=='g'||v=='l'?`<td>${a.np.size}</td>`:''}<td><b>${nf(a.q)}</b></td>${SM?`<td><input type="number" min="0" step="1" class="sfx" data-k="${esc(r.s+'|'+r.c+'|'+r.n)}" value="${a.sf.f}" style="width:56px;text-align:right">${a.sf.src=='conferir'?' <span class="pill" style="background:var(--warnbg);color:var(--warn);border-radius:9px;padding:1px 6px;font-size:11px">conferir</span>':a.sf.src=='você'?' <span class="g">editado</span>':''}</td><td><b>${nf(a.sq)}</b></td>`:''}<td>${nf(a.v,2)}</td><td>${a.q?nf(a.v/a.q,2):'–'}</td><td>${a.on&&tq?nf(a.q/tq*100,1)+'%':'–'}</td><td>${a.on&&tv?nf(a.v/tv*100,1)+'%':'–'}</td></tr>`}).join('');
 const cs=1+(v=='pl'?3:v=='p'?3:v=='g'?2:1)+(v=='p'||v=='g'||v=='l'?1:0);
 t+=`<tr class="tot"><td class="t" colspan="${cs}">Total marcado (${nf(ON.length)} de ${nf(G.filter(a=>!a.gx).length)} linhas)</td><td>${nf(tq)}</td>${SM?`<td></td><td>${nf(tS)}</td>`:''}<td>${nf(tv,2)}</td><td>${tq?nf(tv/tq,2):'–'}</td><td>100%</td><td>100%</td></tr></tbody></table>${SM?'<p class="note" style="margin-top:8px">Salsichas por unidade: <b>duplo = 2</b>; combos com "(4 DOG DUPLO)" = 8; o resto = 1. Itens marcados "conferir" (3 em 1, Big Fome, triplo) estão com 1 até você confirmar. Pode editar o número na coluna, e o total recalcula.</p>':''}`;
 const vis=G.filter(a=>!a.gx);
 $$('ptab').innerHTML=t;document.querySelectorAll('.sfx').forEach(i=>i.onchange=e=>{FX[e.target.dataset.k]=+e.target.value||0;pr()});
 document.querySelectorAll('.ck').forEach(i=>i.onchange=e=>{const k=e.target.dataset.k;e.target.checked?EX.delete(k):EX.add(k);pr()});
 document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{const k=b.dataset.g;EXG.has(k)?EXG.delete(k):EXG.add(k);pr()});
 $$('ckA').onclick=()=>{vis.forEach(a=>EX.delete(a.k));pr()};$$('ckN').onclick=()=>{vis.forEach(a=>EX.add(a.k));pr()};if($$('ckR'))$$('ckR').onclick=()=>{EX.clear();EXG.clear();pr()};
 $$('pmore').innerHTML=vis.length>lim?`<button class="btn" id="mo" style="margin-top:10px">Mostrar mais (${nf(vis.length-lim)} restantes)</button>`:'';
 if($$('mo'))$$('mo').onclick=()=>{lim+=500;pr()};
 document.querySelectorAll('th.s').forEach(th=>th.onclick=()=>{const s=th.dataset.s;if(sk==s)sd=-sd;else{sk=s;sd=s=='n'?1:-1}pr()});}
$$('csv').onclick=()=>{const v=$$('fv').value;const rows=last.map(a=>{const r=a.r;return[v=='l'?r.l:v=='g'?r.s:r.n,v=='pl'?r.l:'',r.s,r.c,PL[r.p],a.q,a.v.toFixed(2).replace('.',',')]});
 const csv='﻿Item;Loja;Grupo;Cód.;Pão;Quantidade;Valor\n'+rows.map(x=>x.map(y=>'"'+String(y).replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='produtos_outubro_2025.csv';a.click()};
</script></body></html>
